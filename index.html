<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadGen Agency</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">

    <h2>LeadGen</h2>

    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
    </nav>

  </header>

  <!-- HERO SECTION -->
  <section class="hero">

    <!-- IMAGE SLIDER -->
    <div class="image-slider">

      <img class="slide active"
        src="https://images.unsplash.com/photo-1557804506-669a67965ba0?auto=format&fit=crop&w=1400&q=80">

      <img class="slide"
        src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1400&q=80">

      <img class="slide"
        src="https://images.unsplash.com/photo-1556761175-4b46a572b786?auto=format&fit=crop&w=1400&q=80">

      <img class="slide"
        src="https://images.unsplash.com/photo-1553877522-43269d4ea984?auto=format&fit=crop&w=1400&q=80">

    </div>

    <!-- OVERLAY -->
    <div class="overlay"></div>

    <!-- HERO CONTENT -->
    <div class="hero-content">

      <h1>
        Global B2B Lead Generation That Drives Revenue
      </h1>

      <p>
        We provide verified global CEO, founder, and decision-maker contacts
        to help your business scale faster.
      </p>

      <button onclick="scrollToContact()">
        Get Global Leads
      </button>

    </div>

  </section>

  <!-- SERVICES -->
  <section class="services">

    <h2>Our Services</h2>

    <div class="grid">

      <div class="card" onclick="scrollToContact()">
        Global B2B Leads
      </div>

      <div class="card" onclick="scrollToContact()">
        Email Marketing
      </div>

      <div class="card" onclick="scrollToContact()">
        SEO Growth
      </div>

    </div>

  </section>

  <!-- CONTACT -->
  <section id="contact" class="contact">

    <h2>Get Leads Now</h2>

    <form action="https://api.web3forms.com/submit" method="POST">

      <!-- WEB3FORMS KEY -->
      <input
        type="hidden"
        name="access_key"
        value="2aa3f5ac-360d-46b9-b610-d49acb59e872"
      >

      <!-- SUBJECT -->
      <input
        type="hidden"
        name="subject"
        value="New Lead from Website"
      >

      <!-- NAME -->
      <input
        type="text"
        name="name"
        placeholder="Your Name"
        required
      >

      <!-- EMAIL -->
      <input
        type="email"
        name="email"
        placeholder="Your Email"
        required
      >

      <!-- MESSAGE -->
      <textarea
        name="message"
        rows="5"
        placeholder="Your Requirement"
        required
      ></textarea>

      <button type="submit">
        Send Request
      </button>

    </form>

  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 LeadGen Agency</p>
  </footer>

    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();

  <!-- JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
